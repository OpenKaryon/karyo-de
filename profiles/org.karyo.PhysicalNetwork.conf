<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<busconfig>
  <policy user="root">
    <allow own="org.karyo.PhysicalNetwork"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.karyo.PhysicalNetwork" send_interface="org.karyo.PhysicalNetwork1"/>
    <allow send_destination="org.karyo.PhysicalNetwork" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.karyo.PhysicalNetwork" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
